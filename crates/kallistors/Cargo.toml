[package]
name = "kallistors"
version = "0.3.2"
description = "A Rust reimplementation of kallisto-style pseudoalignment and RNA-seq quantification."
readme = "../../README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
autobins = false

[[bin]]
name = "kallistors"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
thiserror = "2.0.18"
croaring-sys = "4.7.0"
boomphf = "0.6.0"
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
hdf5-pure = "0.5.0"
rayon = "1.12.0"
crossbeam-channel = "0.5.15"
time = { version = "0.3.47", features = ["formatting", "local-offset"] }
mimalloc = { version = "0.1.50", features = ["local_dynamic_tls"] }

[dev-dependencies]
tempfile = "3.27.0"
