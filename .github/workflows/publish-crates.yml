name: Publish to crates.io

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish kallistors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify tag matches crate version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          tag_version="${tag#v}"
          crate_version="$(
            cargo metadata --no-deps --format-version 1 \
              | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "kallistors"))'
          )"

          if [[ "${tag_version}" != "${crate_version}" ]]; then
            echo "Tag ${tag} does not match kallistors ${crate_version}."
            exit 1
          fi

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --workspace --all-features

      - name: package dry run
        run: cargo publish --package kallistors --locked --dry-run

      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN secret is required to publish to crates.io."
            exit 1
          fi

          cargo publish --package kallistors --locked --token "${CARGO_REGISTRY_TOKEN}"
